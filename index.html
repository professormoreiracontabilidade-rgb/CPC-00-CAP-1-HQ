<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211064"><title>Quiz CPC 00 | 6 questões | Professor Moreira</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#211445}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#7430cb,transparent 45%),linear-gradient(140deg,#17094c,#0646a4)}main{max-width:860px;margin:auto;padding:15px 12px 110px}.top{text-align:center;color:white;padding:8px 0 15px}.top small{font-weight:900;font-size:clamp(15px,3vw,20px)}h1{font-size:clamp(25px,6vw,41px);color:#ffe83e;margin:5px 0;text-shadow:2px 3px #13083e}.top p{font-weight:750;margin:5px}.progress{height:12px;background:#fff5;border-radius:20px;overflow:hidden;margin:15px 0}.bar{height:100%;width:0;background:#ffdc32;transition:width .25s}.screen{background:#fff;border:4px solid #ffdb2b;border-radius:22px;padding:clamp(16px,4vw,30px);box-shadow:0 14px 40px #0006}.tag{display:inline-block;background:#ffe138;color:#1e1155;font-weight:900;padding:9px 12px;border-radius:12px}.meta{font-weight:700;color:#5d5082;margin-top:14px;overflow-wrap:anywhere}h2{font-size:clamp(23px,5vw,31px)}.question{font-size:clamp(19px,4.2vw,24px);line-height:1.55;white-space:pre-wrap}.choices{display:flex;gap:12px;margin:22px 0;flex-wrap:wrap}.choice{flex:1;min-width:125px;padding:17px 12px;font-size:22px;font-weight:900;border-radius:14px;border:3px solid #382184;background:#f3edff;color:#251355;cursor:pointer}.choice[aria-pressed=true]{background:#ffe448;border-color:#d72d3b}.hint{color:#5d5082}.hero{display:block;width:100%;height:auto;border-radius:14px;border:2px solid #ddd}.result{font-weight:900;font-size:23px;padding:16px;border-radius:14px;margin:16px 0}.correct{background:#d7f7e0;color:#08652b}.wrong{background:#ffe1e1;color:#a00e21}.neutral{background:#e9e5ff;color:#332080}.explain{font-size:clamp(17px,3.7vw,21px);line-height:1.55}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:9px;padding:11px;background:#160b48f2;border-top:3px solid #ffe039}.nav button{border:0;border-radius:12px;background:#ffdf36;color:#21134d;font-size:clamp(14px,3vw,17px);font-weight:900;padding:14px 11px;min-width:85px;cursor:pointer}.nav button:disabled{opacity:.4}.nav .reset{background:#e9e2ff}footer{color:#e2dfff;text-align:center;padding:15px;font-size:13px}img{max-width:100%}[hidden]{display:none!important}
</style></head><body><main><header class="top"><small>CURSO DE CONTABILIDADE</small><h1>PROFESSOR MOREIRA</h1><p>CPC 00 • ESTRUTURA CONCEITUAL • CEBRASPE</p><div class="progress" aria-label="Progresso"><div class="bar" id="bar"></div></div><div id="counter"></div></header><section class="screen" id="panel" aria-live="polite"></section><footer>Material didático • Curso de Contabilidade Professor Moreira</footer></main><nav class="nav" aria-label="Navegação"><button id="prev">← Voltar</button><button class="reset" id="reset">↻ Reiniciar</button><button id="next">Avançar →</button></nav><script>
const questions=[{"banca": "Tec (EMBRAPA)/EMBRAPA/Orçamento e Finanças/Contabilidade/2025", "texto": "Julgue o item a seguir, de acordo com a Resolução CFC n.º 1.374/2011, que trata da estrutura conceitual para elaboração e divulgação de relatório contábil-financeiro. Uma utilidade da informação contábil-financeira é permitir que investidores e credores avaliem se as suas expectativas, em termos de retorno, serão atendidas, devendo tal avaliação ser feita por meio da análise das perspectivas associadas aos fluxos de caixa futuros de entrada para a entidade em que se pretende fazer o investimento.", "gabarito": "C", "explicacao": "Investidores e credores avaliam as perspectivas de geração de caixa da entidade para decidir sobre o fornecimento de recursos. No CPC 00 (R2), a expressão técnica é “entradas líquidas de caixa futuras”.", "imagem": "imagem-01.webp"}, {"banca": "AFCE (TCE-SC)/TCE SC/Ciências Contábeis/2022", "texto": "Quanto à estrutura conceitual para elaboração e divulgação de relatório contábil-financeiro, julgue o item seguinte. Os relatórios econômico-financeiros de propósitos gerais podem atender a um público bastante diversificado, mas seu público preferencial é aquele que financia a entidade que os elabora.", "gabarito": "C", "explicacao": "O público principal dos relatórios financeiros para fins gerais é formado por investidores, credores por empréstimos e outros credores, existentes e potenciais. Outros usuários também podem se beneficiar das informações.", "imagem": "imagem-02.webp"}, {"banca": "Cont (Cach Itapemirim)/Pref Cach Itapemirim/2024", "texto": "Julgue o item seguinte, em relação aos pronunciamentos do Comitê de Pronunciamentos Contábeis. Para ser útil aos variados segmentos de usuários, a informação contábil deve ser customizada à necessidade de cada segmento.", "gabarito": "E", "explicacao": "Os relatórios de propósito geral atendem a necessidades comuns de informação; não são relatórios individualmente customizados para cada segmento de usuários.", "imagem": "imagem-03.webp"}, {"banca": "APF/PF/2025", "texto": "Julgue o item subsequente, que dizem respeito à finalidade da contabilidade e a patrimônio, atos e fatos administrativos, contas e plano de contas. A principal finalidade do relatório financeiro para fins gerais é atender às necessidades da administração da entidade, fornecendo informações internas detalhadas para o planejamento e controle operacional e priorizando os usuários internos em detrimento dos externos.", "gabarito": "E", "explicacao": "O relatório financeiro para fins gerais tem como foco os usuários externos principais, não a gestão interna. A administração pode utilizar relatórios gerenciais específicos para planejamento e controle.", "imagem": "imagem-04.webp"}, {"banca": "AJ STJ/STJ/Apoio Especializado/Contadoria/2024", "texto": "Julgue o item a seguir, de acordo com a NBC TG Estrutura Conceitual para Elaboração e Divulgação de Relatório Contábil-financeiro. Dadas as finalidades distintas e necessidades diversas de governos, órgãos reguladores e autoridades tributárias, devem ser apresentadas tantas demonstrações financeiras de propósitos gerais quantas sejam necessárias para atender a cada um desses usuários.", "gabarito": "E", "explicacao": "Governos, reguladores e autoridades tributárias podem exigir informações próprias, mas isso não significa produzir uma demonstração financeira de propósito geral distinta para cada um. Os relatórios gerais destinam-se a necessidades comuns.", "imagem": "imagem-05.webp"}, {"banca": "Esp GT (TELEBRAS)/TELEBRAS/Analista Superior/Finanças/2026", "texto": "Considerando os pronunciamentos técnicos do Comitê de Pronunciamentos Contábeis (CPC), julgue o item seguinte. De acordo com a estrutura conceitual para relatório financeiro, os ativos representam recursos econômicos, o passivo e o patrimônio líquido retratam as reivindicações contra a entidade, e as receitas e despesas são as parcelas das alterações em recursos econômicos e reivindicações que refletem o desempenho da entidade, tendo como base o regime de competência.", "gabarito": "C", "explicacao": "O CPC 00 apresenta ativos como recursos econômicos, passivos e patrimônio líquido como reivindicações contra a entidade, e receitas e despesas como alterações relacionadas ao desempenho financeiro, reconhecidas segundo o regime de competência.", "imagem": "imagem-06.webp"}];
const key='prof-moreira-cpc00-6-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let step=Number.isInteger(saved.step)?Math.max(0,Math.min(11,saved.step)):0;let answers=saved.answers||{};
const panel=document.getElementById('panel'),prev=document.getElementById('prev'),next=document.getElementById('next');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(key,JSON.stringify({step,answers}))}catch(e){}}function render(){const i=Math.floor(step/2),q=questions[i],resolution=step%2===1,a=answers[i],correct=q.gabarito===a;document.getElementById('bar').style.width=((step+1)/12*100)+'%';document.getElementById('counter').textContent=`Questão ${i+1} de 6 • ${resolution?'Resolução ilustrada':'Texto original da banca'}`;if(!resolution){panel.innerHTML=`<span class="tag">QUESTÃO ${String(i+1).padStart(2,'0')} • CERTO OU ERRADO</span><p class="meta">CEBRASPE (CESPE) – ${escapeHtml(q.banca)}</p><h2>Julgue o item a seguir</h2><div class="question">${escapeHtml(q.texto)}</div><div class="choices" role="group" aria-label="Marque sua resposta"><button class="choice" data-answer="C" aria-pressed="${a==='C'}">( ) Certo</button><button class="choice" data-answer="E" aria-pressed="${a==='E'}">( ) Errado</button></div><p class="hint">Escolha uma alternativa e avance para a resolução em quadrinhos.</p>`;panel.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{answers[i]=b.dataset.answer;persist();render()}));}else{let msg=a?(correct?'✓ Você acertou!':'✕ Você errou. Confira a explicação.'):'Gabarito comentado';panel.innerHTML=`<span class="tag">RESOLUÇÃO • IMAGEM ${String(i+1).padStart(2,'0')}</span><h2>Aprenda com a história em quadrinhos</h2><img class="hero" src="${q.imagem}" alt="História ilustrada do CPC 00, página ${i+1}, com exemplos contábeis" loading="eager"><div class="result ${a?(correct?'correct':'wrong'):'neutral'}">${msg}<div>GABARITO: ${q.gabarito==='C'?'CERTO (C)':'ERRADO (E)'}</div></div><div class="explain"><strong>Comentário do Professor Moreira:</strong><p>${escapeHtml(q.explicacao)}</p></div>`;}prev.disabled=step===0;next.textContent=step===11?'Concluir ✓':resolution?'Próxima questão →':'Ver resolução →';persist();}function go(n){step=Math.max(0,Math.min(11,n));render();window.scrollTo(0,0)}prev.onclick=()=>go(step-1);next.onclick=()=>{if(step===11){alert('Parabéns! Você concluiu as 6 questões do CPC 00.');return}go(step+1)};document.getElementById('reset').onclick=()=>{if(confirm('Reiniciar as 6 questões e apagar as respostas marcadas?')){answers={};go(0)}};render();
</script></body></html>
